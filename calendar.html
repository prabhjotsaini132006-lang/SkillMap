<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMap - Calendar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">◆</span>
                SkillMap
            </a>

            <nav>
                <a href="index.html" class="btn btn-secondary">
            ← Roadmaps
            </a>

            <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Toggle theme">
                🌙
            </button>
        </nav>
        </div>
        </header>

    <main class="container">
        <section class="roadmap-header">
            <span class="section-kicker">PLANNING</span>
            <h1>Calendar</h1>
            <p>Plan your skills and stay ahead of your deadlines.</p>
        </section>

        <section class="calendar-section">
            <div class="calendar-header">
                <button type="button" class="btn btn-secondary" id="previous-month">
                    ←
                </button>

                <h2 id="calendar-month">October 2026</h2>

                <button type="button" class="btn btn-secondary" id="next-month">
                    →
                </button>
            </div>

            <div class="calendar-weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <div id="calendar-grid" class="calendar-grid"></div>
        </section>

        <section class="deadline-panel">
            <div class="section-header">
                <div>
                    <span class="section-kicker">DEADLINES</span>
                    <h2>Upcoming Deadlines</h2>
                    <p>Your scheduled skill deadlines will appear here.</p>
                </div>
            </div>

            <div id="calendar-deadlines"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 SkillMap</p>
    </footer>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/calendar.js"></script>
</body>
</html>
